name: Notify IndexNow

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate current sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Notify IndexNow after production deploy
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
          INDEXNOW_AFTER: ${{ github.sha }}
          INDEXNOW_WAIT_FOR_DEPLOY: 'true'
        run: node scripts/indexnow.mjs
